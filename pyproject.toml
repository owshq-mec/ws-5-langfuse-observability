[project]
name = "ws-langfuse-observability"
version = "0.1.0"
description = "AIDE workshop: Helix context engine for Orbisa, observed with Langfuse"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "graphiti-core==0.31.1",
    "anthropic>=0.69,<1.0",
    "openai>=1.99,<3",
    "fastembed>=0.7",
    "mcp>=2.3,<3",
    "claude-agent-sdk>=0.2.168",
    "langfuse>=4.18,<5",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context", "src/observability", "src/clients"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
